<ion-header mode="ios" class="app-header">
  <ion-toolbar mode="ios">
    <div class="header-row">
      <div class="logo-wrap">
        <ion-img src="assets/images/white_onwi_logo.png"></ion-img>
      </div>

      <div class="user-info">
        <p class="username">{{ user.Name }}</p>
        <div class="logout" (click)="exit()">
          <span>Logout</span>
          <ion-icon name="log-out"></ion-icon>
        </div>
      </div>

      <ion-avatar class="profile-avatar">
        <img [src]="user.Photo" />
      </ion-avatar>
    </div>

    <ion-img src="assets/images/divider.svg" class="header-divider"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content [scrollEvents]="true" (ionScroll)="logScrolling($event)">
  <ion-grid>
    <ion-row class="content-toolbar">
      <ion-col size="10" class="toolbar-search">
        <ion-searchbar mode="ios" placeholder="Search documents" [(ngModel)]="search" (ionChange)="inputFilterSearch()" show-clear-button="always"></ion-searchbar>
      </ion-col>

      <ion-col size="2" class="toolbar-refresh">
        <ion-button mode="ios" class="refresh-button" (click)="refresh(true)">
          <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-segment id="tabs-folders" mode="md" scrollable value="{{tabsFolders}}" class="app-segment">
          <ion-segment-button value="Library" [routerLink]="['/library']" routerDirection="root" *ngIf="user.isViewer">
            <ion-label>Library</ion-label>
          </ion-segment-button>
          <ion-segment-button value="My Documents" [routerLink]="['/my-documents']" routerDirection="root">
            <ion-label>My Documents</ion-label>
          </ion-segment-button>
          <ion-segment-button value="My Favorites" [routerLink]="['/my-favorites']" routerDirection="root">
            <ion-label>My Favorites</ion-label>
          </ion-segment-button>
          <ion-segment-button value="Last Docs Distributed">
            <ion-label>Last Docs Distributed</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div>
    <ion-text color="dark" *ngIf="!documents?.length">
      <p class="ion-padding empty-state">No files found.</p>
    </ion-text>

    <ion-list lines="none" class="ion-no-margin doc-list">
      <ion-item lines="none" *ngFor="let doc of documents; let i = index" class="doc-item">
        <ion-img [src]="doc.DocumentVersionIcon" slot="start" (click)="openFile(doc)" class="doc-thumb"></ion-img>
        <ion-label (click)="openFile(doc)" class="doc-label">
          <b>{{ doc.DocumentTag }} </b>{{ doc.DocumentDesignation }}
        </ion-label>
        
        <ng-container *ngIf="splitVersion(doc.DocumentVersion) as v">
          <ion-badge slot="end" class="version-badge" *ngIf="v.top || v.bottom">
            <span class="version-line">{{ v.top }}</span>
            <span class="version-line" *ngIf="v.bottom">{{ v.bottom }}</span>
          </ion-badge>
        </ng-container>

        <ion-icon src="assets/icons/icon-star.svg" slot="end"
          *ngIf="!doc.DocumentFavorite && networkStatus !== 'offline'"
          class="doc-action-icon favorite-icon" (click)="addFavorite(doc, i)"></ion-icon>
        <ion-icon src="assets/icons/icon-starfull.svg" slot="end"
          *ngIf="doc.DocumentFavorite && networkStatus !== 'offline'"
          class="doc-action-icon favorite-icon" (click)="removeFavorite(doc, i)"></ion-icon>

        <ion-icon src="assets/icons/icon-edit.svg" slot="end" 
          class="doc-action-icon edit-icon" (click)="approveDoc(doc)"></ion-icon>
      </ion-item>
    </ion-list>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" (click)="scrollTop()" *ngIf="showScroll" class="scroll-top-fab">
    <ion-fab-button>
      <ion-icon name="chevron-up-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<ion-footer color="small" mode="md" id="footer-database" class="status-footer">
  <div class="status-text">
    <span class="status-dot" [class.online]="networkStatus !== 'offline'" [class.offline]="networkStatus === 'offline'"></span>
    {{ networkStatus === 'offline' ? 'Offline' : 'Online' }}
  </div>
</ion-footer>
