<ion-header mode="ios">
  <ion-toolbar mode="ios">
    <ion-grid>
      <ion-row>
        <ion-col size="5">
          <div id="logo">
            <ion-img src="assets/images/logo.png"></ion-img>
          </div>
        </ion-col>
        <ion-col size="5">
          <ion-text id="nome">
            <p>{{ user.Name }}</p>
          </ion-text>
          <ion-text id="sair" (click)="exit()">
            <p>Exit <ion-icon size="small" src="assets/images/exit.svg"></ion-icon></p>
          </ion-text>
        </ion-col>
        <ion-col size="2">
          <ion-avatar id="img-perfil">
            <ion-img [src]="user.Photo"></ion-img>
          </ion-avatar>
        </ion-col>
        <ion-col size="12">
          <ion-img src="assets/images/divisor.svg"></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content [scrollEvents]="true" (ionScroll)="logScrolling($event)">
  <ion-grid>
    <ion-row>
      <ion-col size="5" offset="7" class="ion-padding-horizontal">
        <ion-button mode="ios" color="medium" size="small" expand="block" (click)="refresh(true)">
          <ion-icon slot="start" src="assets/images/img-refresh.svg"></ion-icon> Refresh
        </ion-button>
      </ion-col>
      <ion-col size="12">
        <ion-searchbar mode="ios" placeholder="" [(ngModel)]="search" (ionChange)="inputFilterSearch()"></ion-searchbar>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-segment id="tabs-folders" mode="md" scrollable value="{{tabsFolders}}">
          <ion-segment-button value="Library" [routerLink]="['/library']" routerDirection="root" *ngIf="user.isViewer">
            <ion-label>Library</ion-label>
          </ion-segment-button>
          <ion-segment-button value="My Documents" [routerLink]="['/my-documents']" routerDirection="root">
            <ion-label>My Documents</ion-label>
          </ion-segment-button>
          <ion-segment-button value="My Favorites" [routerLink]="['/my-favorites']" routerDirection="root">
            <ion-label>My Favorites</ion-label>
          </ion-segment-button>
          <ion-segment-button value="Last Docs Distributed">
            <ion-label>Last Docs Distributed</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="div-folders">
    <ion-text color="dark" *ngIf="documents === null">
      <p>No files found.</p>
    </ion-text>
    <ion-list lines="none" class="ion-no-margin">
      <ion-item lines="full" *ngFor="let doc of documents; let i = index">
        <!-- <ion-img [src]="doc.DocumentVersionIcon" slot="start" (click)="openFile(doc, i)"></ion-img> -->
         <ion-img [src]="doc.DocumentVersionIcon" slot="start" (click)="openFile(doc)"></ion-img>
        <!-- <ion-icon [src]="doc.DocumentVersionIcon" slot="start"></ion-icon> -->
        <!-- <ion-label (click)="openFile(doc, i)"> -->
        <ion-label (click)="openFile(doc)">
          <b>{{ doc.DocumentTag }} </b>{{ doc.DocumentDesignation }}
        </ion-label>
        <ion-badge slot="end" color="medium" mode="ios">{{ doc.DocumentVersion }}</ion-badge>
        <ion-icon src="assets/images/icon-star.svg" slot="end" *ngIf="!doc.DocumentFavorite && doc.DocumentVersionIsLastVersion" style="font-size: 1em;" (click)="addFavorite(doc, i)"></ion-icon>
        <ion-icon src="assets/images/icon-starfull.svg" slot="end" *ngIf="doc.DocumentFavorite && doc.DocumentVersionIsLastVersion" style="font-size: 1em;" (click)="removeFavorite(doc, i)"></ion-icon>
        <ion-icon src="assets/images/icon-updated.svg" slot="end" *ngIf="doc.DocumentVersionIsLastVersion" style="font-size: 1em;"></ion-icon>
        <ion-icon src="assets/images/icon-edit.svg" slot="end" (click)="approveDoc(doc)" style="font-size: 1em;"></ion-icon>
      </ion-item>
    </ion-list>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" (click)="scrollTop()" *ngIf="showScroll">
    <ion-fab-button>
      <ion-icon name="chevron-up-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
<ion-footer color="medium" mode="md" id="footer-database">
  <ion-toolbar>
    <ion-title>
      <span *ngIf="networkStatus === 'offline'">Offline</span>
    </ion-title>
  </ion-toolbar>
</ion-footer>
