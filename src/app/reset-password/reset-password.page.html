<ion-content class="reset-password-content">
  <div class="reset-password-wrapper">
    <div class="logo-container">
      <div class="logo-circle">
        <ion-img
          src="assets/images/logo-onwi.png"
          class="logo-img">
        </ion-img>
      </div>
    </div>

    <div class="title-container">
      <h2 class="title">
        SET NEW PASSWORD
      </h2>
    </div>

    <div class="reset-password-card">
      <form [formGroup]="resetForm" (ngSubmit)="submitReset()">
        <div class="field-group">
          <ion-label class="field-label">
            New Password
          </ion-label>

          <ion-item lines="none" class="input-item">
            <ion-icon
              slot="start"
              name="lock-closed-outline">
            </ion-icon>

            <ion-input
              enterkeyhint="next"
              [type]="showPassword ? 'text' : 'password'"
              inputmode="text"
              formControlName="newPassword"
              id="newPassword">
            </ion-input>

            <ion-icon
              slot="end"
              [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              (click)="showPassword = !showPassword">
            </ion-icon>
          </ion-item>

          <p class="field-hint">
            Minimum 10 characters, including uppercase, lowercase, number and special character.
          </p>
        </div>

        <div class="field-group">
          <ion-label class="field-label">
            Confirm Password
          </ion-label>

          <ion-item lines="none" class="input-item">
            <ion-icon
              slot="start"
              name="lock-closed-outline">
            </ion-icon>

            <ion-input
              enterkeyhint="enter"
              [type]="showConfirmPassword ? 'text' : 'password'"
              inputmode="text"
              formControlName="confirmPassword"
              id="confirmPassword">
            </ion-input>

            <ion-icon
              slot="end"
              [name]="showConfirmPassword ? 'eye-outline' : 'eye-off-outline'"
              (click)="showConfirmPassword = !showConfirmPassword">
            </ion-icon>
          </ion-item>

          <p *ngIf="getPasswordError()" class="field-error">
            {{ getPasswordError() }}
          </p>
        </div>

        <ion-button
          mode="ios"
          expand="block"
          class="reset-password-button"
          type="submit"
          [disabled]="resetForm.invalid || isSubmitting">

          {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}

        </ion-button>

        <ion-button
          mode="ios"
          fill="clear"
          size="small"
          class="back-link"
          type="button"
          routerLink="/login">

          Back to Login

        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
