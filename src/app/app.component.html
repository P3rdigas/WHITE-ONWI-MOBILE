<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay" swipeGesture="false">
      <ion-header mode="md">
        <ion-toolbar mode="md" style="border-radius: 0 25px 0 0; --background: #B92224; --color: #FFFFFF;">
          <ion-title>Toggle Folders</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="ion-padding-end">
          <ion-list id="menu-list" mode="ios" *ngFor="let f of menuFolders; let i = index">
              <ion-item lines="full" (click)="filterFiles(f)" mode="ios">
                <ion-icon slot="start" src="data:image/png;base64,{{ f.Image }}" *ngIf="f.Image"></ion-icon>
                <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f.image"></ion-icon>
                <ion-label>
                  {{f.Name}}
                  <!--  <ion-icon size="small" [src]="f.icon" style="vertical-align: middle; color: #707070;" *ngIf="f.children.length"></ion-icon> -->
                </ion-label>
              </ion-item>
              <!--  If="f.open" -->
              <!-- <div> -->
                <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f2 of f.children">
                  <ion-item lines="full" (click)="filterFiles(f2)" mode="ios">
                    <ion-icon slot="start" src="data:image/png;base64,{{ f2.Image }}" *ngIf="f2.Image"></ion-icon>
                    <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f2.image"></ion-icon>
                    <ion-label>{{f2.Name}}</ion-label>
                  </ion-item>
                  <!--  If="f2.open" -->
                  <!-- <div> -->
                    <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f3 of f2.children">
                      <ion-item lines="full" (click)="filterFiles(f3)" mode="ios">
                        <ion-icon slot="start" src="data:image/png;base64,{{ f3.Image }}" *ngIf="f3.Image"></ion-icon>
                        <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f3.image"></ion-icon>
                        <ion-label>{{f3.Name}}</ion-label>
                      </ion-item>
                      <!--  If="f3.open" -->
                      <!-- <div> -->
                        <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f4 of f3.children">
                          <ion-item lines="full" (click)="filterFiles(f4)" mode="ios">
                            <ion-icon slot="start" src="data:image/png;base64,{{ f4.Image }}" *ngIf="f4.Image"></ion-icon>
                            <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f4.image"></ion-icon>
                            <ion-label>{{f4.Name}}</ion-label>
                          </ion-item>
                          <!--  If="f4.open" -->
                          <!-- <div> -->
                            <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f5 of f4.children">
                            <ion-item lines="full" (click)="filterFiles(f5)" mode="ios">
                              <ion-icon slot="start" src="data:image/png;base64,{{ f5.Image }}" *ngIf="f5.Image"></ion-icon>
                              <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f5.image"></ion-icon>
                              <ion-label>{{f5.Name}}</ion-label>
                            </ion-item>
                            <!--  If="f5.open" -->
                              <!-- <div> -->
                                <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f6 of f5.children">
                                <ion-item lines="full" (click)="filterFiles(f6)" mode="ios">
                                  <ion-icon slot="start" src="data:image/png;base64,{{ f6.Image }}" *ngIf="f6.Image"></ion-icon>
                                  <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f6.image"></ion-icon>
                                  <ion-label>{{f6.Name}}</ion-label>
                                </ion-item>
                                <!--  If="f6.open" -->
                                  <!-- <div> -->
                                    <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f7 of f6.children">
                                      <ion-item lines="full" (click)="filterFiles(f7)" mode="ios">
                                        <ion-icon slot="start" src="data:image/png;base64,{{ f7.Image }}" *ngIf="f7.Image"></ion-icon>
                                        <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f7.image"></ion-icon>
                                        <ion-label>{{f7.Name}}</ion-label>
                                      </ion-item>
                                      <!--  If="f7.open" -->
                                      <!-- <div> -->
                                        <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f8 of f7.children">
                                          <ion-item lines="full" (click)="filterFiles(f8)" mode="ios">
                                            <ion-icon slot="start" src="data:image/png;base64,{{ f8.Image }}" *ngIf="f8.Image"></ion-icon>
                                            <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f8.image"></ion-icon>
                                            <ion-label>{{f8.Name}}</ion-label>
                                          </ion-item>
                                          <!--  If="f8.open" -->
                                          <div>
                                            <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f9 of f8.children">
                                              <ion-item lines="full" (click)="filterFiles(f9)" mode="ios">
                                                <ion-icon slot="start" src="data:image/png;base64,{{ f9.Image }}" *ngIf="f9.Image"></ion-icon>
                                                <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f9.image"></ion-icon>
                                                <ion-label>{{f9.Name}}</ion-label>
                                              </ion-item>
                                              <!--  If="f9.open" -->
                                              <div>
                                                <ion-list id="menu-list" mode="ios" style="padding-left: 20px;" *ngFor="let f10 of f9.children">
                                                  <ion-item lines="full" (click)="filterFiles(f10)" mode="ios">
                                                    <ion-icon slot="start" src="data:image/png;base64,{{ f10.Image }}" *ngIf="f10.Image"></ion-icon>
                                                    <ion-icon slot="start" src="assets/images/icon-folder.svg" *ngIf="!f10.image"></ion-icon>
                                                    <ion-label>{{f10.Name}}</ion-label>
                                                  </ion-item>
                                                </ion-list>
                                              </div>
                                            </ion-list>
                                          </div>
                                        </ion-list>
                                      <!-- </div> -->
                                    </ion-list>
                                  <!-- </div> -->
                                </ion-list>
                              <!-- </div> -->
                            </ion-list>
                          <!-- </div> -->
                        </ion-list>
                      <!-- </div> -->
                    </ion-list>
                  <!-- </div> -->
                </ion-list>
              <!-- </div> -->
          </ion-list>
        </div>
        <!-- <ion-list id="inbox-list">
          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
            <ion-item (click)="selectedIndex = i" routerDirection="root" [routerLink]="[p.url]" detail="false" [class.selected]="selectedIndex == i">
              <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list> -->

        <!-- <ion-list id="labels-list">
          <ion-item *ngFor="let label of labels">
            <ion-icon slot="start" ios="bookmark-outline" md="bookmark-sharp"></ion-icon>
            <ion-label>{{ label }}</ion-label>
          </ion-item>
        </ion-list> -->
      </ion-content>
      <ion-footer mode="md" id="footer-database" *ngIf="appVersionName">
        <ion-toolbar>
          <ion-title>App version: {{ appVersionName }}</ion-title>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
