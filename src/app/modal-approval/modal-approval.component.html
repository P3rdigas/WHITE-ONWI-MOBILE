<ion-header mode="ios" class="modal-header">
  <ion-toolbar mode="ios">
    <ion-buttons slot="end">
      <ion-button (click)="exit()" class="close-btn">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding-horizontal approve-modal-content">
  <ion-text class="modal-title ion-text-center">
    <h5>Documents to Approve</h5>
  </ion-text>

  <ion-text mode="md" class="modal-description">
    <p>If you accept and understand, you are confirming that you took note of this document and understood its content.</p>
  </ion-text>

  <div class="approve-card">
    <ion-item lines="none" mode="ios" class="checkbox-item">
      <ion-checkbox slot="start" [(ngModel)]="data.isReceived" mode="ios"></ion-checkbox>
      <ion-label>Accept</ion-label>
    </ion-item>

    <ion-item lines="none" mode="ios" class="checkbox-item">
      <ion-checkbox slot="start" [(ngModel)]="data.wasUnderstood" mode="ios"></ion-checkbox>
      <ion-label>Understood</ion-label>
    </ion-item>
  </div>

  <ion-item lines="none" mode="ios" class="comment-item">
    <ion-label position="stacked">Comment:</ion-label>
    <ion-textarea mode="ios" [(ngModel)]="data.Comments" id="Comments" 
      placeholder="Insert your comment here if you don't understand the document or have any question" 
      class="comment-textarea">
    </ion-textarea>
  </ion-item>

  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="8">
        <ion-button mode="ios" expand="block" class="accept-button" [disabled]="!data.isReceived" (click)="postApprove(data)">
          Accept
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
